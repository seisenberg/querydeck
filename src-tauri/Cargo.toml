[package]
name = "querydeck"
version = "0.1.0"
description = "A lightweight cross-platform SQL IDE"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres-rustls = "0.14.0"
rustls = "0.23.41"
rustls-pki-types = "1.15.0"
webpki-roots = "1.0.8"
csv = "1.4.0"
thiserror = "2.0.18"
parking_lot = "0.12.5"
once_cell = "1.21.4"
libloading = "0.9.0"
dirs = "6.0.0"
regex = "1.13.0"
rusqlite = { version = "0.40.1", features = ["bundled", "column_decltype"] }
duckdb = { version = "1.4.4", features = ["bundled"] }
postgres = { version = "0.19.14", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.4", features = ["v4"] }
rust_decimal = { version = "1.42.1", features = ["db-postgres"] }
mysql = { version = "28.0.0", default-features = false, features = ["minimal", "rustls-tls"] }
jni = { version = "0.21", features = ["invocation"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }
tokio = { version = "1.52.3", features = ["rt", "net", "time"] }
tiberius = { version = "0.12", default-features = false, features = ["tds73", "rustls", "chrono"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
tokio-util = { version = "0.7", features = ["compat"] }
futures-util = "0.3.32"
tokio-postgres = "0.7.18"
rust_xlsxwriter = "0.96.0"

[lib]
name = "querydeck_lib"
# rlib only: staticlib/cdylib are for mobile targets and force enormous
# archives now that DuckDB is bundled (a debug staticlib tops 1.5 GB).
crate-type = ["rlib"]

[profile.release]
lto = true
codegen-units = 1

# The bundled DuckDB engine is enormous with C++ debug info (>1.5 GB of
# objects); build it optimized and stripped even in dev — we never debug
# into DuckDB internals, and dev binaries shrink by gigabytes.
[profile.dev.package.libduckdb-sys]
opt-level = 2
debug = false
