[package]
name = "querydeck"
version = "0.1.0"
description = "A lightweight cross-platform SQL IDE"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio-postgres-rustls = "0.14.0"
rustls = "0.23.41"
rustls-pki-types = "1.15.0"
webpki-roots = "1.0.8"
csv = "1.4.0"
thiserror = "2.0.18"
parking_lot = "0.12.5"
once_cell = "1.21.4"
libloading = "0.9.0"
dirs = "6.0.0"
regex = "1.13.0"
rusqlite = { version = "0.40.1", features = ["bundled"] }
postgres = { version = "0.19.14", features = ["with-chrono-0_4", "with-serde_json-1", "with-uuid-1"] }
chrono = { version = "0.4.45", features = ["serde"] }
uuid = { version = "1.23.4", features = ["v4"] }
rust_decimal = { version = "1.42.1", features = ["db-postgres"] }
mysql = { version = "28.0.0", default-features = false, features = ["minimal", "rustls-tls"] }
jni = { version = "0.22.4", features = ["invocation"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "json"] }

[lib]
name = "querydeck_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
lto = true
codegen-units = 1
